[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hewo-runtime-tools"
version = "0.1.0"
description = "Minimal deterministic tools for the HeWo runtime smoke"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hewo-tool = "hewo_tool:main"

[tool.setuptools]
py-modules = ["hewo_tool"]
