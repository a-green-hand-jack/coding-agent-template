name: Validate template
on: [push, pull_request]
jobs:
  definition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: ./scripts/validate-definition.sh example-agent
      - run: ./tests/install/test-install.sh
      - run: docker build --build-arg AGENT_NAME=example-agent -t agent-template:test -f docker/Dockerfile .
